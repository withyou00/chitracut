<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ChitraCut – Video Editor</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121214">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;700&family=Baloo+Tamma+2:wght@400;700&family=Anek+Kannada:wght@400;700&family=Tiro+Kannada&family=Noto+Serif+Kannada:wght@400;700&family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Bebas+Neue&family=Anton&family=Pacifico&family=Lobster&family=Dancing+Script:wght@400;700&family=Permanent+Marker&family=Oswald:wght@400;700&display=swap">
<style>
:root{--bg:#121214;--panel:#1c1c20;--panel2:#26262b;--line:#2f2f35;--text:#e8e8ea;--mute:#9a9aa3;--acc:#1fd1d1;--danger:#ff5a6a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,"Noto Sans Kannada",sans-serif}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#002;border-color:var(--acc);font-weight:600}
select,input[type=number]{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font:inherit}
input[type=range]{accent-color:var(--acc);width:100%}
input[type=color]{width:46px;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:2px;cursor:pointer}
input[type=checkbox]{accent-color:var(--acc);width:16px;height:16px}
textarea{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px;font:15px/1.4 "Noto Sans Kannada",system-ui,sans-serif;resize:vertical}
textarea:focus{outline:none;border-color:var(--acc)}
#app{display:grid;grid-template-rows:46px 1fr 270px;height:100vh}
header{display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
header .logo{font-weight:700;color:var(--acc);font-size:16px;margin-right:auto;white-space:nowrap}
#main{display:grid;grid-template-columns:250px 1fr 340px;min-height:0}
.panel{background:var(--panel);overflow:auto;min-height:0}
#media{border-right:1px solid var(--line)}
#media h4{margin:12px 10px 6px}
#mediaList{padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mitem{background:var(--panel2);border-radius:6px;overflow:hidden;position:relative;cursor:pointer;border:1px solid transparent}
.mitem:hover{border-color:var(--acc)}
.mitem img{width:100%;height:70px;object-fit:cover;display:block;background:#000}
.mitem .nm{padding:4px 6px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute)}
.mitem .du{position:absolute;right:4px;top:4px;background:#000a;padding:0 4px;border-radius:3px;font-size:11px}
#musicBox{padding:0 10px 12px}
#previewWrap{display:flex;flex-direction:column;min-height:0;background:#0b0b0d}
#stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
#out{background:#000;display:block;touch-action:none;cursor:move}
#hint{position:absolute;color:var(--mute);text-align:center;pointer-events:none;padding:20px}
#pbar{display:flex;align-items:center;gap:12px;padding:6px 12px;border-top:1px solid var(--line)}
#tc{font-variant-numeric:tabular-nums;color:var(--acc)}
#insp{border-left:1px solid var(--line);display:flex;flex-direction:column}
#tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#tabs button{border:0;border-radius:0;background:none;padding:10px 9px;color:var(--mute)}
#tabs button.on{color:var(--acc);box-shadow:inset 0 -2px var(--acc)}
#inspBody{padding:12px;overflow:auto;flex:1}
.row{margin-bottom:10px}
.row label{display:flex;justify-content:space-between;color:var(--mute);margin-bottom:2px}
.row label b{color:var(--text);font-weight:500}
.crow{display:flex;align-items:center;justify-content:space-between;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.chip{padding:9px 4px;text-align:center;font-size:12px;overflow:hidden;text-overflow:ellipsis}
.chip.on{border-color:var(--acc);color:var(--acc);background:#1fd1d118}
.chip.font{font-size:15px;padding:8px 4px}
.chip.preset{font-size:18px;padding:8px 0}
.chip.emoji{font-size:24px;padding:4px 0;line-height:1.3}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 10px}
.sw button{width:24px;height:24px;padding:0;border-radius:50%;border:2px solid var(--line)}
h4{margin:14px 0 8px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.empty{color:var(--mute);text-align:center;padding:30px 10px}
.note{color:var(--mute);background:var(--panel2);border-radius:6px;padding:10px;margin-bottom:10px}
#bottom{background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tools{display:flex;gap:6px;padding:6px 10px;align-items:center;border-bottom:1px solid var(--line);overflow-x:auto}
#tools .sp{flex:1}
#tools .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
#tools input{width:110px;min-width:70px}
#tl{position:relative;flex:1;overflow:auto;touch-action:pan-x pan-y}
#tlInner{position:relative;min-height:100%;min-width:100%;padding-bottom:8px}
#ruler{height:22px;position:relative;border-bottom:1px solid var(--line);color:var(--mute);font-size:10px;touch-action:none;cursor:pointer}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);padding-left:3px;pointer-events:none}
#otrack{position:relative;margin-top:6px}
.ov{position:absolute;height:24px;border-radius:5px;font-size:11px;padding:4px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;border:2px solid transparent;color:#fff;touch-action:none}
.ov.text{background:#b4581c}.ov.sticker{background:#a3306b}.ov.image{background:#2f5ca3}
.ov.sel{border-color:#fff}
#track{position:relative;height:66px;margin-top:6px}
#mtrack{position:relative;height:28px;margin-top:6px}
.clip{position:absolute;top:0;height:100%;background:#0d5555;border:2px solid transparent;border-radius:6px;overflow:hidden;cursor:pointer;color:#e6ffff}
.clip.sel{border-color:#fff;z-index:2}
.clip .cn{position:relative;font-size:11px;padding:2px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#0008;z-index:1}
.clip .thumbs{position:absolute;inset:0;background-size:auto 100%;background-repeat:repeat-x;opacity:.75}
.h{position:absolute;top:0;width:10px;height:100%;background:#ffffff40;cursor:ew-resize;z-index:2;touch-action:none}
.h.l{left:0}.h.r{right:0}
.tmark{position:absolute;top:20px;width:20px;height:26px;line-height:24px;text-align:center;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:5px;z-index:4;cursor:pointer}
.tmark.on{background:var(--acc);color:#002;border-color:var(--acc)}
.music{position:absolute;top:0;height:100%;background:linear-gradient(180deg,#5b3fa8,#3e2a75);border-radius:6px;font-size:11px;padding:6px 8px;white-space:nowrap;overflow:hidden}
#ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none;z-index:5}
#ph:before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#fff}
#overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:50}
#overlay .box{background:var(--panel);padding:24px;border-radius:10px;width:min(380px,90vw);text-align:center}
.prog{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:14px 0}
.prog div{height:100%;background:var(--acc);width:0}
@media (max-width:900px){
  #app{display:flex;flex-direction:column;height:auto;min-height:100vh}
  #main{display:contents}
  #media{display:none}
  #previewWrap{order:1;height:45vh}
  #bottom{order:2;height:240px}
  #insp{order:3;border-left:0;min-height:340px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="logo">🎬 ChitraCut</span>
    <button class="primary" id="btnImport">+ Import</button>
    <select id="selRatio" title="Aspect ratio">
      <option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option>
      <option value="4:5">4:5</option><option value="4:3">4:3</option><option value="21:9">21:9</option><option value="orig">Original</option>
    </select>
    <select id="selQ" title="Quality"><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select>
    <select id="selBg" title="Background"><option value="black">BG: Black</option><option value="blur">BG: Blur</option><option value="white">BG: White</option></select>
    <button class="primary" id="btnExport">⬇ Export</button>
  </header>

  <div id="main">
    <aside id="media" class="panel">
      <h4>Media (click = timeline ಗೆ ಸೇರಿಸಿ)</h4>
      <div id="mediaList"></div>
      <h4>Background music</h4>
      <div id="musicBox"></div>
    </aside>

    <section id="previewWrap">
      <div id="stage"><canvas id="out" width="720" height="1280"></canvas><div id="hint">📂 Import ಒತ್ತಿ ಅಥವಾ video / photo ಇಲ್ಲಿ drag ಮಾಡಿ</div></div>
      <div id="pbar">
        <button id="btnPlay">▶</button>
        <span id="tc">00:00.00 / 00:00.00</span>
      </div>
    </section>

    <aside id="insp" class="panel">
      <div id="tabs"></div>
      <div id="inspBody"></div>
    </aside>
  </div>

  <section id="bottom">
    <div id="tools">
      <button id="tUndo" title="Ctrl+Z">↶</button>
      <button id="tRedo" title="Ctrl+Y">↷</button>
      <button id="tSplit" title="S / Ctrl+B">✂ Split</button>
      <button id="tDel" title="Delete">🗑</button>
      <button id="tDup" title="Duplicate">⧉</button>
      <button id="tLeft" title="Move left">◀</button>
      <button id="tRight" title="Move right">▶</button>
      <span class="sep"></span>
      <button id="tText"><b>T</b> Text</button>
      <button id="tSticker">😀 Sticker</button>
      <button id="tPng">🖼 Overlay</button>
      <span class="sp"></span>
      🔍 <input type="range" id="zoom" min="8" max="200" value="40">
    </div>
    <div id="tl"><div id="tlInner"><div id="ruler"></div><div id="otrack"></div><div id="track"></div><div id="mtrack"></div><div id="ph"></div></div></div>
  </section>
</div>

<div id="overlay"><div class="box">
  <h3 id="ovT" style="margin-top:0">Exporting…</h3>
  <div id="ovMsg" style="color:var(--mute)"></div>
  <div class="prog"><div id="ovBar"></div></div>
  <div class="btns" style="justify-content:center" id="ovBtns"></div>
</div></div>

<input type="file" id="fileIn" accept="video/*,audio/*,image/*" multiple hidden>
<input type="file" id="musicIn" accept="audio/*" hidden>
<input type="file" id="lutIn" accept=".cube" hidden>
<input type="file" id="ovImgIn" accept="image/*" hidden>

<script>
'use strict';
/* ================= STATE ================= */
const $ = s => document.querySelector(s);
const S = {media:[],clips:[],overlays:[],luts:[],music:null,sel:null,time:0,total:0,playing:false,pps:40,ratio:'9:16',quality:720,bg:'black',tab:'video',tabOv:'ovtext'};
let uid = 1; const nid = () => 'i' + (uid++);
const vids = {};          // clipId -> <video>
const images = {};        // mediaId -> <img>
const derived = {};       // clipId -> {start,dur,cum,len,td}
const hits = new Map();   // overlayId -> hit box on preview
const undoS = [], redoS = [];
let active = null, editing = false, exporting = false, rec = null, drag = null, cdrag = null;

const pad = n => String(n).padStart(2,'0');
const fmtT = t => { t = Math.max(0,t||0); return pad(Math.floor(t/60)) + ':' + pad(Math.floor(t%60)); };
const fmtTC = t => { t = Math.max(0,t||0); return pad(Math.floor(t/60)) + ':' + pad(Math.floor(t%60)) + '.' + pad(Math.floor((t%1)*100)); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const media = id => S.media.find(m => m.id === id);
const isImg = c => media(c.mediaId).type === 'image';
const selClip = () => S.clips.find(c => c.id === S.sel);
const selOv = () => S.overlays.find(o => o.id === S.sel);
const selItem = () => selClip() || selOv();
const getP = (o,p) => p.split('.').reduce((x,k) => x == null ? x : x[k], o);
const setP = (o,p,v) => { const k = p.split('.'); const last = k.pop(); k.reduce((x,kk) => x[kk], o)[last] = v; };
const fmtV = v => (Math.round(v*10)/10).toString();
const hexA = (h,a) => { const n = parseInt((h||'#000000').slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
const seg = (window.Intl && Intl.Segmenter) ? new Intl.Segmenter('kn',{granularity:'grapheme'}) : null;
const graphemes = s => seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);

function newClip(m){
  return {id:nid(), mediaId:m.id, in:0, out:m.type==='image' ? 3 : m.duration, speed:1, curve:null, curveName:'none',
    volume:100, fadeIn:0, fadeOut:0,
    tf:{scale:100,x:0,y:0,rot:0},
    filter:'none', filterAmt:80,
    adj:{brightness:0,contrast:0,saturation:0,temp:0,tint:0,fade:0,vignette:0,grain:0,sharpen:0},
    lut:'', lutAmt:100,
    anim:{in:'none',out:'none',loop:'none',inDur:0.5,outDur:0.5},
    trans:{type:'none',dur:0.6},
    audio:{voice:'none',bass:0,treble:0,echo:0,reverb:0}};
}
function newOverlay(type, extra){
  return {id:nid(), type, text:'', mediaId:null, start:S.time, dur:3, x:50, y:50,
    size: type==='image' ? 40 : type==='sticker' ? 90 : 48, rot:0, opacity:100,
    font:'Noto Sans Kannada', bold:true, italic:false, align:'center',
    color:'#ffffff', stroke:'#000000', strokeW:0, bgOn:false, bgColor:'#000000', bgAlpha:70, shadow:30, shadowColor:'#000000',
    anim:{in:'fade',out:'fade',loop:'none',inDur:0.5,outDur:0.5}, ...extra};
}

/* ================= PRESETS ================= */
const FILTERS = {
  none:{}, vivid:{saturation:35,contrast:15}, warm:{temp:45,saturation:10}, cool:{temp:-45,tint:-5},
  bw:{saturation:-100,contrast:20}, vintage:{temp:30,saturation:-30,fade:50,vignette:40,grain:25},
  cinema:{contrast:25,saturation:-15,temp:-15,vignette:35}, fade:{fade:70,contrast:-15},
  drama:{contrast:45,saturation:-25,vignette:50,brightness:-10}, moody:{temp:-20,saturation:-35,brightness:-12,fade:20},
  golden:{temp:60,brightness:8,saturation:20}, film:{grain:40,fade:30,contrast:10}
};
const FILTER_NAMES = {none:'None',vivid:'Vivid',warm:'Warm',cool:'Cool',bw:'B&W',vintage:'Vintage',cinema:'Cinematic',fade:'Faded',drama:'Drama',moody:'Moody',golden:'Golden',film:'Film'};
const CURVES = {montage:[2.5,.6,2.5,.6,2.5], hero:[2,2,.3,2,2], bullet:[3,.25,.25,.25,3], jumper:[.5,3,.5,3,.5], flashIn:[4,2,1,1,1], flashOut:[1,1,1,2,4]};
const CURVE_OPTS = [['none','None'],['montage','Montage'],['hero','Hero'],['bullet','Bullet'],['jumper','Jump Cut'],['flashIn','Flash In'],['flashOut','Flash Out'],['custom','Custom']];
const ANIM_IN = [['none','None'],['fade','Fade In'],['zoomIn','Zoom In'],['zoomOut','Zoom Out'],['slideL','Slide Left'],['slideR','Slide Right'],['slideU','Slide Up'],['slideD','Slide Down'],['spin','Spin'],['shake','Shake']];
const ANIM_OUT = ANIM_IN.map(([k,n]) => [k, n.replace(' In',' Out')]);
const ANIM_LOOP = [['none','None'],['kenburns','Ken Burns'],['zoomOutSlow','Slow Zoom Out'],['pulse','Pulse'],['sway','Sway']];
const VOICES = [['none','None'],['michog','Mic Hog'],['megaphone','Megaphone'],['telephone','Telephone'],['robot','Robot'],['lofi','Lo-Fi'],['deep','Deep'],['radio','Radio']];
const TRANS = [['none','None'],['fade','Dissolve'],['black','Fade Black'],['white','Flash White'],['slideL','Slide Left'],['slideR','Slide Right'],['slideU','Slide Up'],['slideD','Slide Down'],['wipeL','Wipe Left'],['wipeR','Wipe Right'],['zoomIn','Zoom In'],['zoomOut','Zoom Out'],['spin','Spin'],['glitch','Glitch']];
const FONTS = [['Noto Sans Kannada','ಕನ್ನಡ Sans'],['Baloo Tamma 2','ಬಲೂ ತಮ್ಮ'],['Anek Kannada','ಅನೇಕ್'],['Tiro Kannada','ತಿರೋ'],['Noto Serif Kannada','ಕನ್ನಡ Serif'],['Poppins','Poppins'],['Montserrat','Montserrat'],['Oswald','Oswald'],['Bebas Neue','Bebas Neue'],['Anton','Anton'],['Pacifico','Pacifico'],['Lobster','Lobster'],['Dancing Script','Dancing'],['Permanent Marker','Marker']];
const TEXT_PRESETS = [
  {color:'#ffffff',strokeW:0,bgOn:false,shadow:30,shadowColor:'#000000'},
  {color:'#ffffff',stroke:'#000000',strokeW:6,bgOn:false,shadow:0},
  {color:'#ffe600',stroke:'#000000',strokeW:7,bgOn:false,shadow:0},
  {color:'#000000',strokeW:0,bgOn:true,bgColor:'#ffffff',bgAlpha:100,shadow:0},
  {color:'#ffffff',strokeW:0,bgOn:true,bgColor:'#e53935',bgAlpha:100,shadow:0},
  {color:'#ffffff',strokeW:0,bgOn:true,bgColor:'#000000',bgAlpha:60,shadow:0},
  {color:'#ffffff',strokeW:0,bgOn:false,shadow:80,shadowColor:'#1fd1d1'},
  {color:'#ff4fa3',stroke:'#ffffff',strokeW:6,bgOn:false,shadow:0}
];
const SWATCHES = ['#ffffff','#000000','#ffe600','#ff3b30','#ff9500','#34c759','#1fd1d1','#007aff','#af52de','#ff4fa3'];
const EMOJIS = '❤️ 😂 😍 🔥 👍 🎉 ✨ ⭐ 💯 😎 🥳 😢 😡 🤔 👏 🙏 💪 🎂 🎁 🌸 🌹 ☀️ 🌙 ⚡ 💥 💫 🎵 🎶 📍 ✅ ❌ ⚠️ 👉 👈 👆 👇 😮 🤩 😇 🥰 😜 🙌 💖 💔 🏆 🎓 📚 🪔'.split(' ');
const OV_IN = [['none','None'],['fade','Fade'],['pop','Pop'],['zoom','Zoom'],['slideUp','Slide Up'],['slideDown','Slide Down'],['slideL','Slide Left'],['slideR','Slide Right'],['typewriter','Typewriter'],['bounce','Bounce'],['spin','Spin'],['blur','Blur']];
const OV_OUT = OV_IN.filter(x => x[0] !== 'bounce' && x[0] !== 'pop');
const OV_LOOP = [['none','None'],['pulse','Pulse'],['shake','Shake'],['float','Float'],['swing','Swing'],['blink','Blink'],['heartbeat','Heartbeat'],['rotate','Rotate']];

/* ================= TIMELINE MATH (speed + curves + transitions) ================= */
const N = 100;
function curveAt(c,p){ if(!c.curve) return 1; const a=c.curve, n=a.length-1; const x=clamp(p,0,1)*n, i=Math.min(Math.floor(x),n-1), f=x-i; return a[i]+(a[i+1]-a[i])*f; }
function rateAt(c,p){ return clamp(c.speed*curveAt(c,p), 0.1, 10); }
function layout(){
  let t = 0, prev = null;
  for(const c of S.clips){
    const len = Math.max(0.05, c.out - c.in), cum = new Float64Array(N+1);
    for(let i=0;i<N;i++) cum[i+1] = cum[i] + len/N/rateAt(c,(i+.5)/N);
    let td = 0;
    if(prev && c.trans && c.trans.type !== 'none') td = Math.min(c.trans.dur, derived[prev.id].dur*.45, cum[N]*.45);
    const start = t - td;
    derived[c.id] = {start, dur:cum[N], cum, len, td};
    t = start + cum[N]; prev = c;
  }
  S.total = t;
}
function srcToLocal(c,src){ const d=derived[c.id]; const p=clamp((src-c.in)/d.len,0,1)*N; const i=Math.min(Math.floor(p),N-1); return d.cum[i]+(d.cum[i+1]-d.cum[i])*(p-i); }
function localToSrc(c,lt){
  const d=derived[c.id], cum=d.cum; lt=clamp(lt,0,cum[N]);
  let lo=0, hi=N; while(hi-lo>1){ const m=(lo+hi)>>1; if(cum[m]<=lt) lo=m; else hi=m; }
  const sg=cum[lo+1]-cum[lo], f=sg>0?(lt-cum[lo])/sg:0;
  return c.in+(lo+f)/N*d.len;
}
function clipAt(t){ for(const c of S.clips){ const d=derived[c.id]; if(t < d.start+d.dur) return c; } return S.clips[S.clips.length-1] || null; }
function currentPair(){
  const a = active; if(!a || !derived[a.id]) return null;
  const b = S.clips[S.clips.indexOf(a)+1];
  if(b && b.trans && b.trans.type !== 'none'){
    const db = derived[b.id];
    if(db && db.td > 0 && S.time >= db.start) return {a, b, p:clamp((S.time-db.start)/db.td,0,1)};
  }
  return {a};
}

/* ================= VIDEO ELEMENTS ================= */
function getVid(c){
  let v = vids[c.id];
  if(!v){ v=document.createElement('video'); v.src=media(c.mediaId).url; v.preload='auto'; v.playsInline=true; v.currentTime=c.in; vids[c.id]=v; }
  return v;
}

/* ================= AUDIO ENGINE (Web Audio) ================= */
let AC=null, master, spk, recDest, impulse=null;
let musicEl=null, musicNode=null, musicGain=null;
const srcNodes = new WeakMap();
const chains = new Map();   // clipId -> audio chain
function initAudio(){
  if(AC) return;
  AC = new (window.AudioContext||window.webkitAudioContext)();
  master = AC.createGain(); spk = AC.createGain();
  master.connect(spk); spk.connect(AC.destination);
  recDest = AC.createMediaStreamDestination(); master.connect(recDest);
}
function nodeFor(el){ let n=srcNodes.get(el); if(!n){ n=AC.createMediaElementSource(el); srcNodes.set(el,n); } return n; }
function shaperCurve(k){ const n=1024, a=new Float32Array(n); for(let i=0;i<n;i++){ const x=i*2/n-1; a[i]=(1+k)*x/(1+k*Math.abs(x)); } return a; }
function getImpulse(){
  if(impulse) return impulse;
  const len=Math.floor(AC.sampleRate*2.2), b=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){ const d=b.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  return impulse=b;
}
function buildChain(c){
  const a=c.audio, nodes=[], input=AC.createGain(); let cur=input;
  const link = n => { cur.connect(n); cur=n; nodes.push(n); return n; };
  const filt = (type,f,q,g) => { const n=AC.createBiquadFilter(); n.type=type; n.frequency.value=f; if(q!=null) n.Q.value=q; if(g!=null) n.gain.value=g; return n; };
  const shaper = k => { const s=AC.createWaveShaper(); s.curve=shaperCurve(k); s.oversample='4x'; return s; };
  const gain = v => { const g=AC.createGain(); g.gain.value=v; return g; };
  link(filt('lowshelf',200,null,a.bass));      // Bass boost
  link(filt('highshelf',3500,null,a.treble));  // Treble
  switch(a.voice){
    case 'michog':   link(filt('highpass',250,.7)); link(filt('peaking',2200,1,9)); link(shaper(40)); link(filt('lowpass',5500,.7)); link(gain(.55)); break;
    case 'megaphone':link(filt('highpass',600,1)); link(filt('lowpass',3000,1)); link(shaper(15)); link(gain(.7)); break;
    case 'telephone':link(filt('highpass',400,1)); link(filt('lowpass',3400,1)); break;
    case 'robot':   { const g=gain(0), o=AC.createOscillator(); o.frequency.value=60; o.connect(g.gain); o.start(); nodes.push(o); link(g); break; }
    case 'lofi':     link(filt('lowpass',2200,.5)); link(shaper(4)); break;
    case 'deep':     link(filt('lowshelf',150,null,10)); link(filt('highshelf',2500,null,-10)); break;
    case 'radio':    link(filt('highpass',500,1)); link(filt('lowpass',4500,1)); link(filt('peaking',1500,1,6)); link(shaper(6)); break;
  }
  const vol=gain(1); nodes.push(vol);
  const dry=gain(1); cur.connect(dry); dry.connect(vol); nodes.push(dry);
  if(a.echo>0){
    const d=AC.createDelay(2); d.delayTime.value=.28;
    const fb=gain(Math.min(.75,a.echo/100*.75)), wet=gain(a.echo/100*.8);
    cur.connect(d); d.connect(fb); fb.connect(d); d.connect(wet); wet.connect(vol); nodes.push(d,fb,wet);

    const cv=AC.createConvolver(); cv.buffer=getImpulse(); const wet=gain(a.reverb/100*1.2);

}
function dropChainFor(id){
  const ch = chains.get(id); if(!ch) return;
  try{ ch.src.disconnect(); }catch(e){}
  try{ ch.input.disconnect(); }catch(e){}
  ch.nodes.forEach(n => { try{ n.disconnect(); if(n.stop) n.stop(); }catch(e){} });
  chains.delete(id);
}
function dropAllChains(){ [...chains.keys()].forEach(dropChainFor); }
function ensureChain(c){
  if(!AC || isImg(c)) return null;
  let ch = chains.get(c.id); if(ch) return ch;
  const sn = nodeFor(getVid(c)); try{ sn.disconnect(); }catch(e){}
  ch = buildChain(c); sn.connect(ch.input); ch.src = sn; chains.set(c.id, ch);
  return ch;
}
function rebuildChain(c){ if(chains.has(c.id)){ dropChainFor(c.id); ensureChain(c); } }
function syncAudio(){
  if(!AC) return;
  const pr = currentPair(), want = pr ? [pr.a, pr.b].filter(Boolean) : [];
  for(const id of [...chains.keys()]) if(!want.some(c => c.id === id)) dropChainFor(id);
  want.forEach(ensureChain);
}
function ensureMusicNode(){
  if(musicEl && AC && !musicNode){ musicNode=AC.createMediaElementSource(musicEl); musicGain=AC.createGain(); musicNode.connect(musicGain); musicGain.connect(master); }
}
function syncMusic(){
  if(!musicEl || !S.music) return;
  ensureMusicNode();
  if(S.playing && S.time < S.music.duration){
    if(Math.abs(musicEl.currentTime - S.time) > .25) musicEl.currentTime = S.time;
    musicEl.play().catch(()=>{});
  } else musicEl.pause();
}

/* ================= PLAYBACK ================= */
function activate(c,src){
  if(active !== c){
    for(const k in vids) if(k !== c.id) vids[k].pause();
    active = c;
  }
  if(!isImg(c)){
    const v = getVid(c);
    if(Math.abs(v.currentTime - src) > (S.playing ? .2 : .04)) v.currentTime = src;
  }
  const nx = S.clips[S.clips.indexOf(c)+1];   // preload next clip
  if(nx && !isImg(nx) && S.time < derived[nx.id].start){
    const nv = getVid(nx); if(nv.paused && Math.abs(nv.currentTime-nx.in) > .1) nv.currentTime = nx.in;
  }
}
function syncSecondary(){
  const pr = currentPair(); if(!pr || !pr.b || isImg(pr.b)) return;
  const b = pr.b, v = getVid(b), want = localToSrc(b, S.time - derived[b.id].start);
  if(S.playing){
    if(v.paused){ v.currentTime = want; v.play().catch(()=>{}); }
    else if(Math.abs(v.currentTime - want) > .3) v.currentTime = want;
    const r = Math.round(rateAt(b,(v.currentTime-b.in)/derived[b.id].len)*20)/20;
    if(v.playbackRate !== r) v.playbackRate = r;
  } else if(Math.abs(v.currentTime - want) > .04) v.currentTime = want;
}
function seek(t){
  S.time = clamp(t, 0, S.total||0);
  const c = clipAt(S.time);
  if(!c){ active=null; updatePH(); return; }
  activate(c, localToSrc(c, S.time - derived[c.id].start));
  syncSecondary();
  if(S.playing){ if(!isImg(c)) getVid(c).play().catch(()=>{}); syncMusic(); }
  syncAudio();
  updatePH();
}
async function play(){
  if(!S.clips.length) return;
  initAudio(); if(AC.state === 'suspended') await AC.resume();
  if(S.time >= S.total - .05) S.time = 0;
  S.playing = true; seek(S.time); syncAudio(); updatePlayBtn();
}
function pause(){
  S.playing = false;
  for(const k in vids) vids[k].pause();
  if(musicEl) musicEl.pause();
  updatePlayBtn();
}
function updatePlayBtn(){ $('#btnPlay').textContent = S.playing ? '⏸' : '▶'; }

let lastNow = 0, pairKey = '';
function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(.1, (now - lastNow)/1000 || 0); lastNow = now;
  if(S.playing){
    const c = active;
    if(!c){ pause(); }
    else {
      const d = derived[c.id], end = d.start + d.dur; let done = false;
      if(isImg(c)){ S.time += dt; done = S.time >= end; }
      else {
        const v = vids[c.id];
        if(v.currentTime >= c.out - .02 || v.ended) done = true;
        else {
          const r = Math.round(rateAt(c,(v.currentTime-c.in)/d.len)*20)/20;
          if(v.playbackRate !== r) v.playbackRate = r;
          S.time = d.start + srcToLocal(c, v.currentTime);
        }
      }
      if(done){
        const nx = S.clips[S.clips.indexOf(c)+1];
        if(nx){
          if(!isImg(c)) vids[c.id].pause();
          S.time = end; activate(nx, localToSrc(nx, S.time - derived[nx.id].start));
          if(!isImg(nx)) getVid(nx).play().catch(()=>{});
        } else { S.time = S.total; pause(); onPlaybackEnd(); }
      }
      syncSecondary();
    }
  }
  const pr = currentPair();
  const key = pr ? pr.a.id + '|' + (pr.b ? pr.b.id : '') : '';
  if(key !== pairKey){ pairKey = key; syncAudio(); }
  if(pr){
    for(const [c,role] of [[pr.a,'a'],[pr.b,'b']]){
      if(!c) continue; const ch = chains.get(c.id); if(!ch) continue;
      const d = derived[c.id], lt = S.time - d.start; let g = c.volume/100;
      if(c.fadeIn > 0)  g *= clamp(lt/c.fadeIn, 0, 1);
      if(c.fadeOut > 0) g *= clamp((d.dur-lt)/c.fadeOut, 0, 1);
      if(pr.b) g *= role === 'a' ? 1 - pr.p : pr.p;
      ch.vol.gain.value = g;
    }
  }
  if(musicGain && S.music) musicGain.gain.value = S.music.volume/100;
  render(now);
  updatePH();
  if(exporting) $('#ovBar').style.width = (S.total ? S.time/S.total*100 : 0) + '%';
}

const U = {};

const texA = mkTex(), texB = mkTex();
const dummy = mkTex(); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
gl.uniform1i(U.u_tex,0); gl.uniform1i(U.u_lut,1);
const EX0 = {s:1,dx:0,dy:0,a:1,r:0};

function fxParams(c){ const p={...c.adj}, f=FILTERS[c.filter]||{}, k=c.filterAmt/100; for(const key in f) p[key]=(p[key]||0)+f[key]*k; return p; }

function animState(c,lt,dur){

function drawClip(c,tex,ex){

    const k=Math.max(W/vw,H/vh);

  gl.uniform2f(U.u_off,c.tf.x+an.dx+ex.dx,c.tf.y-an.dy-ex.dy);

  const W=cv.width, H=cv.height;

  const bgc = tr && tr.clear != null ? tr.clear : (S.bg==='white' ? 1 : 0);

/* ================= LUTs ================= */
function addLut(name,n,data){
  const max = gl.getParameter(gl.MAX_TEXTURE_SIZE);
  if(n*n > max) throw new Error(`LUT size ${n} ತುಂಬಾ ದೊಡ್ಡದು (ಈ device max ${Math.floor(Math.sqrt(max))})`);
  const t = mkTex(); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,n*n,n,0,gl.RGBA,gl.UNSIGNED_BYTE,data);
  const l = {id:nid(), name, n, tex:t}; S.luts.push(l); return l;
}
function parseCube(txt){
  let n=0; const vals=[];
  for(const line of txt.split(/\r?\n/)){
    const t=line.trim(); if(!t || t[0]==='#') continue;
    if(/^LUT_3D_SIZE/i.test(t)){ n=parseInt(t.split(/\s+/)[1]); continue; }
    if(/^[A-Za-z_]/.test(t)) continue;
    const p=t.split(/\s+/).map(Number); if(p.length>=3 && !isNaN(p[0])) vals.push(p[0],p[1],p[2]);
  }
  if(!n || vals.length < n*n*n*3) throw new Error('ಸರಿಯಾದ 3D .cube LUT ಅಲ್ಲ');
  const data = new Uint8Array(n*n*n*4);
  for(let b=0;b<n;b++) for(let g=0;g<n;g++) for(let r=0;r<n;r++){
    const i=(r+g*n+b*n*n)*3, o=(g*n*n+b*n+r)*4;
    data[o]=clamp(vals[i]*255,0,255); data[o+1]=clamp(vals[i+1]*255,0,255); data[o+2]=clamp(vals[i+2]*255,0,255); data[o+3]=255;
  }
  return {n, data};
}
function makeLut(name,fn,n=17){
  const data=new Uint8Array(n*n*n*4);
  for(let b=0;b<n;b++) for(let g=0;g<n;g++) for(let r=0;r<n;r++){
    const o=fn(r/(n-1),g/(n-1),b/(n-1)), idx=(g*n*n+b*n+r)*4;
    data[idx]=clamp(o[0]*255,0,255); data[idx+1]=clamp(o[1]*255,0,255); data[idx+2]=clamp(o[2]*255,0,255); data[idx+3]=255;
  }
  addLut(name,n,data);
}
function makeBuiltinLuts(){
  const lum=(r,g,b)=>.299*r+.587*g+.114*b, sc=x=>x*x*(3-2*x);
  makeLut('Teal & Orange',(r,g,b)=>{const l=lum(r,g,b)-.5;return [sc(r)+l*.25,g+l*.05,sc(b)-l*.25];});
  makeLut('Warm Film',(r,g,b)=>[Math.pow(r,.88)*1.02,Math.pow(g,.95),Math.pow(b,1.12)*.92+.03]);
  makeLut('Cyberpunk',(r,g,b)=>[r*.9+b*.25,g*.8,b*1.1+.08]);
  makeLut('Bleach',(r,g,b)=>{const l=lum(r,g,b);return [sc(r*.5+l*.5),sc(g*.5+l*.5),sc(b*.5+l*.5)];});
  makeLut('Sepia',(r,g,b)=>[r*.393+g*.769+b*.189,r*.349+g*.686+b*.168,r*.272+g*.534+b*.131]);
  makeLut('Matrix',(r,g,b)=>[r*.7,g*1.15+.03,b*.7]);
  makeLut('Noir',(r,g,b)=>{const l=sc(sc(lum(r,g,b)));return [l,l,l];});
}

/* ================= IMPORT ================= */
function probe(url){
  return new Promise((res,rej)=>{
    const v=document.createElement('video'); v.preload='auto'; v.muted=true; v.playsInline=true; let fixing=false;
    v.onloadedmetadata=()=>{ if(!isFinite(v.duration)){ fixing=true; v.currentTime=1e7; } else v.currentTime=Math.min(1,v.duration/2); };
    v.onseeked=()=>{
      if(fixing){ fixing=false; v.currentTime=Math.min(1,v.duration/2); return; }
      const c=document.createElement('canvas'); c.width=160; c.height=Math.round(160*v.videoHeight/v.videoWidth)||90;
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);
      res({duration:v.duration,w:v.videoWidth,h:v.videoHeight,thumb:c.toDataURL('image/jpeg',.7)});
    };
    v.onerror=()=>rej(new Error('ಈ video ಓದಲು ಆಗುತ್ತಿಲ್ಲ (format support ಇಲ್ಲ)'));
    v.src=url;
  });
}
function probeImage(url){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas'); c.width=160; c.height=Math.round(160*img.naturalHeight/img.naturalWidth)||90;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res({img,w:img.naturalWidth,h:img.naturalHeight,thumb:c.toDataURL('image/png')});
    };
    img.onerror=()=>rej(new Error('ಈ photo ಓದಲು ಆಗುತ್ತಿಲ್ಲ'));
    img.src=url;
  });
}
async function addImageMedia(f){
  const url=URL.createObjectURL(f), info=await probeImage(url);
  const m={id:nid(),name:f.name,url,type:'image',duration:3600,thumb:info.thumb,w:info.w,h:info.h};
  images[m.id]=info.img; S.media.push(m); return m;
}
async function importFiles(files){
  for(const f of files){
    try{
      if(f.type.startsWith('video/')){
        const url=URL.createObjectURL(f), info=await probe(url);
        const m={id:nid(),name:f.name,url,type:'video',duration:info.duration,thumb:info.thumb,w:info.w,h:info.h};
        S.media.push(m); pushUndo(); S.clips.push(newClip(m));
      } else if(f.type.startsWith('image/')){
        const m=await addImageMedia(f); pushUndo(); S.clips.push(newClip(m));
      } else if(f.type.startsWith('audio/')) setMusic(f);
    }catch(e){ alert(f.name+': '+e.message); }
  }
  if(S.ratio==='orig') setCanvas();
  if(!S.sel && S.clips[0]) S.sel = S.clips[0].id;
  afterEdit(); renderMediaPanel();
}
function setMusic(f){
  const url=URL.createObjectURL(f);
  if(!musicEl){ musicEl=new Audio(); musicEl.preload='auto'; }
  musicEl.src=url;
  musicEl.onloadedmetadata=()=>{ S.music={name:f.name,url,duration:musicEl.duration,volume:S.music?S.music.volume:60}; renderTimeline(); renderMediaPanel(); };
}

/* ================= EDIT OPERATIONS ================= */
function snap(){ return JSON.stringify({c:S.clips, o:S.overlays}); }
function pushUndo(){ undoS.push(snap()); if(undoS.length>80) undoS.shift(); redoS.length=0; }
function restore(s){
  pause(); const d=JSON.parse(s); S.clips=d.c; S.overlays=d.o||[];
  active=null; dropAllChains(); pairKey='';
  if(!selItem()) S.sel = S.clips[0] ? S.clips[0].id : null;
  afterEdit();
}
function undo(){ if(!undoS.length) return; redoS.push(snap()); restore(undoS.pop()); }
function redo(){ if(!redoS.length) return; undoS.push(snap()); restore(redoS.pop()); }
function afterEdit(){ layout(); renderTimeline(); renderInspector(); seek(Math.min(S.time,S.total)); $('#hint').style.display=(S.clips.length||S.overlays.length)?'none':''; }
function split(){
  const o=selOv();
  if(o){
    if(S.time-o.start<.1 || o.start+o.dur-S.time<.1) return;
    pushUndo(); const b=JSON.parse(JSON.stringify(o)); b.id=nid();
    b.start=S.time; b.dur=o.start+o.dur-S.time; o.dur=S.time-o.start; o.anim.out='none'; b.anim.in='none';
    S.overlays.splice(S.overlays.indexOf(o)+1,0,b); S.sel=b.id; afterEdit(); return;
  }
  const c=clipAt(S.time); if(!c) return;
  const d=derived[c.id], lt=S.time-d.start; if(lt<.1 || d.dur-lt<.1) return;
  pushUndo();
  const src=localToSrc(c,lt), b=JSON.parse(JSON.stringify(c)); b.id=nid();
  c.out=src; b.in=src; c.anim.out='none'; b.anim.in='none'; b.trans={type:'none',dur:.6};
  S.clips.splice(S.clips.indexOf(c)+1,0,b); S.sel=b.id; afterEdit();
}
function del(){
  const o=selOv();

  const c=selClip(); if(!c) return;

}
function dup(){

  const c=selClip(); if(!c) return;

}

  const c=selClip(); if(!c) return; const i=S.clips.indexOf(c), j=i+dir;

  if(a==='dup') return dup();

/* ---- preview drag / pinch / wheel ---- */
const pts = new Map(); let wheelT = 0, wheelTimer = 0;
function toCv(e){ const r=out.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*out.width, y:(e.clientY-r.top)/r.height*out.height}; }

    const dx=p.x-h.cx, dy=p.y-h.cy, cs=Math.cos(-h.rot), sn=Math.sin(-h.rot), s=Math.max(.05,h.s);
    const x=(dx*cs-dy*sn)/s, y=(dx*sn+dy*cs)/s;

function setSize(it,v){ if(it.type) it.size=Math.round(clamp(v,5,it.type==='image'?150:400)); else it.tf.scale=Math.round(clamp(v,10,400)); }

  const it = hitAt(p) || active; if(!it) return;

      <div class="h l" data-h="l"></div><div class="h r" data-h="r"></div></div>${tm}`;
  }).join('');
  $('#mtrack').innerHTML=S.music?`<div class="music" style="left:0;width:${S.music.duration*pps}px">♪ ${esc(S.music.name)}</div>`:'';
  updatePH();
}
function updatePH(){
  const x=S.time*S.pps; $('#ph').style.left=x+'px';
  $('#tc').textContent=fmtTC(S.time)+' / '+fmtTC(S.total);
  if(S.playing){ const tl=$('#tl'); if(x>tl.scrollLeft+tl.clientWidth-40 || x<tl.scrollLeft) tl.scrollLeft=x-40; }
}
const tl=$('#tl'), tlInner=$('#tlInner');
tl.addEventListener('pointerdown',e=>{
  if(exporting) return;
  const tm=e.target.closest('.tmark');
  if(tm){ S.sel=tm.dataset.tid; S.tab='trans'; renderTimeline(); renderInspector(); return; }
  const ovEl=e.target.closest('.ov'), h=e.target.closest('.h'), cl=e.target.closest('.clip');
  if(ovEl){
    const o=S.overlays.find(z=>z.id===ovEl.dataset.oid); select(o.id);
    drag = h ? {type:'ovtrim',side:h.dataset.h,o,x0:e.clientX,start0:o.start,dur0:o.dur,undo:false}
             : {type:'ovmove',o,x0:e.clientX,start0:o.start,undo:false};
    tl.setPointerCapture(e.pointerId); e.preventDefault(); return;
  }
  if(h && cl){
    const c=S.clips.find(x=>x.id===cl.dataset.id); S.sel=c.id; pushUndo();
    drag={type:'trim',side:h.dataset.h,c,x0:e.clientX,in0:c.in,out0:c.out};
    tl.setPointerCapture(e.pointerId); e.preventDefault();
  } else if(cl){ select(cl.dataset.id); }
  else {
    drag={type:'seek'}; seek((e.clientX-tlInner.getBoundingClientRect().left)/S.pps);
    if(e.target.closest('#ruler')){ tl.setPointerCapture(e.pointerId); e.preventDefault(); }
  }
});
tl.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(drag.type==='trim'){
    const c=drag.c, ds=(e.clientX-drag.x0)/S.pps*c.speed, m=media(c.mediaId);
    if(drag.side==='l') c.in=clamp(drag.in0+ds,0,c.out-.2); else c.out=clamp(drag.out0+ds,c.in+.2,m.duration);
    layout(); renderTimeline();
  } else if(drag.type==='ovmove' || drag.type==='ovtrim'){
    const dt=(e.clientX-drag.x0)/S.pps, o=drag.o;
    if(!drag.undo){ if(Math.abs(e.clientX-drag.x0)<3) return; pushUndo(); drag.undo=true; }
    if(drag.type==='ovmove') o.start=Math.max(0,drag.start0+dt);
    else if(drag.side==='l'){ const ns=clamp(drag.start0+dt,0,drag.start0+drag.dur0-.2); o.dur=drag.start0+drag.dur0-ns; o.start=ns; }
    else o.dur=Math.max(.2,drag.dur0+dt);
    renderTimeline();
  } else if(drag.type==='seek' && e.buttons) seek((e.clientX-tlInner.getBoundingClientRect().left)/S.pps);
});
const endDrag=()=>{
  if(drag){
    if(drag.type==='trim') afterEdit();
    else if((drag.type==='ovmove'||drag.type==='ovtrim') && drag.undo) renderInspector();
  }
  drag=null;
};
tl.addEventListener('pointerup',endDrag); tl.addEventListener('pointercancel',endDrag);

const CLIP_TABS=[['video','Video'],['anim','Animation'],['trans','Transition'],['speed','Speed'],['filter','Filters'],['adjust','Adjust'],['lut','LUT'],['audio','Audio']];
function ovTabs(o){
  return o.type==='text' ? [['ovtext','Text'],['ovstyle','Style'],['ovanim','Animation']]
       : o.type==='sticker' ? [['ovsticker','Sticker'],['ovanim','Animation']]
       : [['ovimg','Image'],['ovanim','Animation']];
}
function sl(c,label,path,min,max,step=1,unit=''){
  const v=getP(c,path);
  return `<div class="row"><label>${label}<b id="v_${path.replace(/\./g,'_')}">${fmtV(v)}${unit}</b></label><input type="range" min="${min}" max="${max}" step="${step}" value="${v}" data-p="${path}" data-u="${unit}"></div>`;
}
function chips(c,path,opts,cols=3){
  const v=getP(c,path);
  return `<div class="grid" style="grid-template-columns:repeat(${cols},1fr)">${opts.map(([k,n])=>`<button class="chip ${v===k?'on':''}" data-set="${path}" data-val="${k}">${n}</button>`).join('')}</div>`;
}
function colorRow(o,label,path,swatch){
  return `<div class="row crow"><span>${label}</span><input type="color" data-p="${path}" value="${o[path]}"></div>`+
    (swatch?`<div class="sw">${SWATCHES.map(s=>`<button style="background:${s}" data-set="${path}" data-val="${s}" title="${s}"></button>`).join('')}</div>`:'');
}
function presetCss(p){
  return `color:${p.color};background:${p.bgOn?hexA(p.bgColor,(p.bgAlpha??100)/100):'#333'};-webkit-text-stroke:${p.strokeW?Math.min(2,p.strokeW/3)+'px '+p.stroke:'0'};text-shadow:${p.shadow?`0 0 ${p.shadow/8}px ${p.shadowColor}`:'none'};font-weight:700`;
}
function curveSvg(c){
  const W=300,H=90,y=v=>H/2-Math.log10(v)*H/2,pts=[];
  for(let i=0;i<=60;i++){ const p=i/60; pts.push((p*W).toFixed(1)+','+y(clamp(curveAt(c,p),.1,10)).toFixed(1)); }
  return `<svg id="curveSvg" viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--panel2);border-radius:6px;display:block"><line x1="0" x2="${W}" y1="${H/2}" y2="${H/2}" stroke="#555" stroke-dasharray="4 4"/><polyline fill="none" stroke="#1fd1d1" stroke-width="2" points="${pts.join(' ')}"/></svg>`;
}
function ovCommon(o){
  return `<h4>Position & size</h4>${sl(o,'Size','size',5,o.type==='image'?150:400)}${sl(o,'X','x',0,100,.5,'%')}${sl(o,'Y','y',0,100,.5,'%')}
    ${sl(o,'Rotate','rot',-180,180,1,'°')}${sl(o,'Opacity','opacity',0,100,1,'%')}${sl(o,'Duration','dur',.3,30,.1,'s')}
    <div class="note">💡 Preview ನಲ್ಲಿ ನೇರವಾಗಿ drag ಮಾಡಿ ಸರಿಸಿ · mouse wheel / ಎರಡು ಬೆರಳು pinch = size</div>
    <div class="btns"><button data-oact="center">Center</button><button data-oact="up">Layer ↑</button><button data-oact="down">Layer ↓</button><button data-oact="dup">⧉ Duplicate</button><button data-oact="del">🗑 Delete</button></div>`;
}

  switch(S.tab){
    case 'video':
      h=`<h4>Transform</h4>${sl(c,'Scale','tf.scale',10,400,1,'%')}${sl(c,'Position X','tf.x',-cv.width,cv.width)}${sl(c,'Position Y','tf.y',-cv.height,cv.height)}${sl(c,'Rotate','tf.rot',-180,180,1,'°')}
         <div class="btns"><button data-act="fill">Fill canvas</button><button data-act="fit">Fit</button><button data-act="resetTf">Reset</button></div>
         <div class="note">💡 Preview ನಲ್ಲಿ video drag ಮಾಡಿ ಸರಿಸಬಹುದು</div>`; break;
    case 'anim':
      h=`<h4>In animation</h4>${chips(c,'anim.in',ANIM_IN)}${sl(c,'In duration','anim.inDur',.1,3,.1,'s')}
         <h4>Out animation</h4>${chips(c,'anim.out',ANIM_OUT)}${sl(c,'Out duration','anim.outDur',.1,3,.1,'s')}
         <h4>Combo (whole clip)</h4>${chips(c,'anim.loop',ANIM_LOOP)}
         <button data-all="anim">Apply to all clips</button>`; break;
    case 'trans':
      if(S.clips.indexOf(c)===0) h='<div class="note">ಮೊದಲ clip ಗೆ transition ಇಲ್ಲ. ಎರಡು clip ಗಳ ನಡುವಿನ <b>⇄</b> ಗುಂಡಿ ಒತ್ತಿ ಅಥವಾ ಎರಡನೇ clip select ಮಾಡಿ.</div>';
      else h=`<h4>Transition (ಹಿಂದಿನ clip → ಈ clip)</h4>${chips(c,'trans.type',TRANS)}${sl(c,'Duration','trans.dur',.1,2,.1,'s')}
         <button data-all="trans">Apply to all clips</button>`;
      break;
    case 'speed':
      h=`<h4>Normal speed</h4>${sl(c,'Speed','speed',.1,10,.1,'x')}
         <div class="row" style="color:var(--mute)">Source ${fmtTC(c.out-c.in)} → Timeline <b id="durInfo" style="color:var(--text)">${fmtTC(derived[c.id].dur)}</b></div>`;

      h=`<h4>Volume</h4>${sl(c,'Volume','volume',0,200,1,'%')}${sl(c,'Fade in','fadeIn',0,5,.1,'s')}${sl(c,'Fade out','fadeOut',0,5,.1,'s')}
         <h4>Equalizer</h4>${sl(c,'Bass boost','audio.bass',-15,15,1,' dB')}${sl(c,'Treble','audio.treble',-15,15,1,' dB')}
         <h4>Voice effects</h4>${chips(c,'audio.voice',VOICES)}
         ${sl(c,'Echo','audio.echo',0,100,1,'%')}${sl(c,'Reverb','audio.reverb',0,100,1,'%')}
         <button data-all="audio">Apply to all clips</button>`; break;

function applyChange(p){
  const o=selOv(); if(o){ if(p==='dur') renderTimeline(); return; }
  const c=selClip(); if(!c) return;
  if(p==='speed' || p.startsWith('curve') || p.startsWith('trans')){
    layout(); renderTimeline();
    const di=$('#durInfo'); if(di) di.textContent=fmtTC(derived[c.id].dur);
    const sv=$('#curveSvg'); if(sv) sv.outerHTML=curveSvg(c);
    if(!S.playing) seek(Math.min(S.time,S.total));
  } else if(p.startsWith('audio')) rebuildChain(c);
}
$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('[data-tab]'); if(!b) return;
  if(selOv()) S.tabOv=b.dataset.tab; else S.tab=b.dataset.tab;
  renderInspector();
});
const IB=$('#inspBody');
IB.addEventListener('input',e=>{
  const el=e.target, p=el.dataset.p, it=selItem(); if(!p || !it) return;
  if(!editing){ pushUndo(); editing=true; }
  const val = el.type==='range'||el.type==='number' ? parseFloat(el.value) : el.type==='checkbox' ? el.checked : el.value;
  setP(it,p,val);
  if(p.startsWith('curve.')) it.curveName='custom';
  if(el.type==='range'){ const lab=document.getElementById('v_'+p.replace(/\./g,'_')); if(lab) lab.textContent=fmtV(val)+(el.dataset.u||''); }
  applyChange(p);
});
IB.addEventListener('change',e=>{ editing=false; if(e.target.type==='range') e.target.blur(); renderTimeline(); });
IB.addEventListener('click',e=>{
  const t=e.target.closest('button'); const it=selItem(); if(!t || !it) return;
  if(t.dataset.set){
    pushUndo(); setP(it,t.dataset.set,t.dataset.val);
    if(t.dataset.set==='font') ensureFont(t.dataset.val);
    renderInspector(); renderTimeline(); applyChange(t.dataset.set); return;
  }
  if(t.dataset.toggle){ pushUndo(); it[t.dataset.toggle]=!it[t.dataset.toggle]; renderInspector(); return; }
  if(t.dataset.preset!=null){ pushUndo(); Object.assign(it, TEXT_PRESETS[+t.dataset.preset]); renderInspector(); return; }
  if(t.dataset.oact){ ovAction(t.dataset.oact); return; }
  if(t.dataset.all==='ovanim'){
    pushUndo(); for(const x of S.overlays) if(x!==it && x.type===it.type) x.anim=JSON.parse(JSON.stringify(it.anim));
    t.textContent='✓ Applied to all'; return;
  }
  const c=selClip(); if(!c) return;
  if(t.dataset.act){
    const a=t.dataset.act, m=media(c.mediaId);
    if(a==='importLut'){ $('#lutIn').click(); return; }
    pushUndo();
    if(a==='resetTf') c.tf={scale:100,x:0,y:0,rot:0};
    if(a==='fit') c.tf.scale=100;
    if(a==='fill'){ const W=cv.width,H=cv.height; c.tf.scale=Math.round(Math.max(W/m.w,H/m.h)/Math.min(W/m.w,H/m.h)*100); c.tf.x=0; c.tf.y=0; }
    if(a==='resetAdj'){ for(const k in c.adj) c.adj[k]=0; }
    if(a==='curve'){
      const v=t.dataset.val; c.curveName=v;
      c.curve = v==='none' ? null : v==='custom' ? (c.curve?[...c.curve]:[1,1,1,1,1]) : [...CURVES[v]];
      layout(); renderTimeline(); seek(Math.min(S.time,S.total));
    }
    renderInspector();
  } else if(t.dataset.all){
    pushUndo(); const k=t.dataset.all;
    const keys={filter:['filter','filterAmt','adj'],lut:['lut','lutAmt'],audio:['audio','volume','fadeIn','fadeOut'],anim:['anim'],trans:['trans']}[k];
    for(const o of S.clips) if(o!==c) for(const key of keys) o[key]=JSON.parse(JSON.stringify(c[key]));
    if(k==='audio') S.clips.forEach(rebuildChain);
    if(k==='trans'){ layout(); seek(Math.min(S.time,S.total)); }
    renderTimeline(); t.textContent='✓ Applied to all';
  }
});

/* ================= EXPORT ================= */
function showOverlay(title,msg,btns){
  $('#overlay').style.display='flex'; $('#ovT').textContent=title; $('#ovMsg').textContent=msg; $('#ovBtns').innerHTML=btns;
}
async function exportVideo(){
  if(!S.clips.length) return alert('ಮೊದಲು video / photo import ಮಾಡಿ');
  if(!window.MediaRecorder) return alert('ಈ browser export support ಮಾಡುವುದಿಲ್ಲ. Chrome ಬಳಸಿ.');
  pause(); initAudio(); await AC.resume();
  const mt=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  const stream=new MediaStream([...out.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const chunks=[];
  rec=new MediaRecorder(stream,{mimeType:mt, videoBitsPerSecond:S.quality>=1080?12e6:S.quality>=720?6e6:3e6});
  rec.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  rec.onstop=()=>{
    exporting=false; spk.gain.value=1;
    const blob=new Blob(chunks,{type:mt.split(';')[0]}), url=URL.createObjectURL(blob);
    const name='ChitraCut_'+Date.now()+(mt.includes('mp4')?'.mp4':'.webm');
    const a=document.createElement('a'); a.href=url; a.download=name; a.click();
    showOverlay('✅ Export ಮುಗಿಯಿತು', name+' ('+(blob.size/1048576).toFixed(1)+' MB)', `<a href="${url}" download="${name}"><button class="primary">Download again</button></a><button id="ovClose">Close</button>`);
  };
  exporting=true; spk.gain.value=0;   // mute speakers while recording
  showOverlay('Exporting…','ಈ tab ತೆರೆದಿಡಿ — video real-time ನಲ್ಲಿ render ಆಗುತ್ತದೆ','<button id="ovCancel">Cancel</button>');
  seek(0);
  setTimeout(()=>{ if(!exporting) return; rec.start(250); play(); }, 400);
}
function onPlaybackEnd(){ if(exporting && rec && rec.state==='recording') setTimeout(()=>rec.stop(),200); }
$('#overlay').addEventListener('click',e=>{
  if(e.target.id==='ovCancel'){ exporting=false; spk.gain.value=1; if(rec){ rec.onstop=null; if(rec.state!=='inactive') rec.stop(); } pause(); $('#overlay').style.display='none'; }
  if(e.target.id==='ovClose') $('#overlay').style.display='none';
});

/* ================= WIRING ================= */
$('#btnImport').onclick=()=>$('#fileIn').click();
$('#fileIn').onchange=e=>{ importFiles([...e.target.files]); e.target.value=''; };
$('#musicIn').onchange=e=>{ if(e.target.files[0]) setMusic(e.target.files[0]); e.target.value=''; };
$('#lutIn').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const {n,data}=parseCube(await f.text()); const l=addLut(f.name.replace(/\.cube$/i,''),n,data); const c=selClip(); if(c){ pushUndo(); c.lut=l.id; } renderInspector(); renderTimeline(); }
  catch(err){ alert(err.message); }
};
$('#ovImgIn').onchange=async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  try{ const m=await addImageMedia(f); renderMediaPanel(); addOverlay(newOverlay('image',{mediaId:m.id}),'ovimg'); }
  catch(err){ alert(err.message); }
};
$('#tText').onclick=()=>addOverlay(newOverlay('text',{text:'ನಿಮ್ಮ ಪಠ್ಯ ಇಲ್ಲಿ'}),'ovtext');
$('#tSticker').onclick=()=>addOverlay(newOverlay('sticker',{text:'❤️',anim:{in:'pop',out:'fade',loop:'none',inDur:.5,outDur:.4}}),'ovsticker');
$('#tPng').onclick=()=>$('#ovImgIn').click();
$('#btnPlay').onclick=()=>S.playing?pause():play();
$('#btnExport').onclick=exportVideo;
$('#selRatio').onchange=e=>{ S.ratio=e.target.value; setCanvas(); renderInspector(); };
$('#selQ').onchange=e=>{ S.quality=+e.target.value; setCanvas(); renderInspector(); };
$('#selBg').onchange=e=>{ S.bg=e.target.value; };
$('#tUndo').onclick=undo; $('#tRedo').onclick=redo; $('#tSplit').onclick=split; $('#tDel').onclick=del; $('#tDup').onclick=dup;
$('#tLeft').onclick=()=>move(-1); $('#tRight').onclick=()=>move(1);
$('#zoom').oninput=e=>{ S.pps=+e.target.value; renderTimeline(); };
document.addEventListener('keydown',e=>{
  if(exporting || e.target.matches('input,select,textarea')) return;
  const k=e.key.toLowerCase(), mod=e.ctrlKey||e.metaKey;
  if(e.code==='Space'){ e.preventDefault(); S.playing?pause():play(); }
  else if(mod && k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); }
  else if(mod && k==='y'){ e.preventDefault(); redo(); }
  else if((mod && k==='b') || (!mod && k==='s')){ e.preventDefault(); split(); }
  else if(!mod && k==='t'){ e.preventDefault(); $('#tText').click(); }
  else if(k==='delete' || k==='backspace'){ del(); }
  else if(k==='arrowleft'){ seek(S.time-1/30); }
  else if(k==='arrowright'){ seek(S.time+1/30); }
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); importFiles([...e.dataTransfer.files]); });
new ResizeObserver(fitCanvas).observe($('#stage'));
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});

makeBuiltinLuts(); setCanvas(); layout(); renderMediaPanel(); renderTimeline(); renderInspector();
requestAnimationFrame(tick);
</script>
</body>
</html>

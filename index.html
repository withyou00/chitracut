<!doctype html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChitraCut">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ChitraCut – Video Editor</title>
<meta name="description" content="Free professional video editor that runs in your browser">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;700&family=Baloo+Tamma+2:wght@400;700&family=Anek+Kannada:wght@400;700&family=Tiro+Kannada&family=Noto+Serif+Kannada:wght@400;700&family=Poppins:wght@400;700&family=Montserrat:wght@400;700&family=Bebas+Neue&family=Anton&family=Pacifico&family=Lobster&family=Dancing+Script:wght@400;700&family=Permanent+Marker&family=Oswald:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand">
      <button id="btnHome" class="ib" title="Home"></button>
      <span class="logo"><i id="logoIc"></i><span>ChitraCut</span><small class="ver">v29</small></span>
    </div>
    <div class="ptitle"><span id="projName" title="Rename">Project</span><span id="saveState"></span></div>
    <div class="tright"><button id="btnExport" class="primary"></button></div>
  </header>

  <section id="left" class="card">
    <nav id="ltabs"></nav>
    <div id="lbody"><aside id="lsub"></aside><div id="lcontent"></div></div>
  </section>

  <section id="player" class="card">
    <div class="phead"><span>Player</span><span id="pInfo" style="color:var(--mute);font-weight:400;font-size:11.5px"></span></div>
    <div id="stage">
      <canvas id="out" width="720" height="1280"></canvas>
      <div id="hint"><b>Add media</b><br>Press <b>Import</b> on the left or drag video / photo / music here</div>
      <div id="pickTip">🎯 Click the colour to remove</div><div id="recTip">● REC</div>
    </div>
    <div class="pfoot">
      <div class="tcs"><span id="tcCur">00:00:00:00</span><span class="sl">/</span><span id="tcTot">00:00:00:00</span></div>
      <button id="btnPlay" class="ib" title="Play (Space)"></button>
      <div class="pright">
        <select id="selBg" title="Canvas background"><option value="black">Black</option><option value="blur">Blur</option><option value="white">White</option></select>
        <select id="selRatio" title="Ratio">
          <option value="9:16">9:16</option><option value="16:9">16:9</option><option value="1:1">1:1</option>
          <option value="4:5">4:5</option><option value="4:3">4:3</option><option value="21:9">21:9</option><option value="orig">Original</option>
        </select>
        <button id="btnFull" class="ib" title="Full screen"></button>
      </div>
    </div>
  </section>

  <section id="right" class="card">
    <nav id="rtabs"></nav>
    <div id="rsub"></div>
    <div id="inspBody"></div>
  </section>

  <section id="bottom" class="card">
    <div id="tools"></div>
    <div id="tl"><div id="tlInner"><div id="tlRows"></div><div id="ph"></div></div></div>
  </section>
</div>

<div id="overlay" class="modalbg"><div class="box">
  <h3 id="ovT" style="margin-top:0">Exporting…</h3>
  <div id="ovMsg" style="color:var(--mute)"></div>
  <div class="prog"><div id="ovBar"></div></div>
  <div class="btns" style="justify-content:center" id="ovBtns"></div>
</div></div>
<div id="modal" class="modalbg"><div class="box" id="modalBox"></div></div>
<div id="home" class="modalbg"><div class="hwrap" id="homeBox"></div></div>

<input type="file" id="fileIn" accept="video/*,audio/*,image/*" multiple hidden>
<input type="file" id="audioIn" accept="audio/*" hidden>
<input type="file" id="lutIn" accept=".cube" hidden>
<input type="file" id="pipIn" accept="video/*,image/*" hidden>
<input type="file" id="srtIn" accept=".srt,text/plain" hidden>

<script src="core.js"></script>
<script src="extras.js"></script>
<script src="ui.js"></script>
</body>
</html>
